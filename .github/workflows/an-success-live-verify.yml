name: A&N Student Hub live browser verification
on:
  push:
    paths:
      - ".github/workflows/an-success-live-verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect actual published GitHub Pages HTML
        shell: bash
        run: |
          set -eu
          URL="https://mehedialimayon-del.github.io/salesman-performance-app/an-overseas/index.html?liveqa=${GITHUB_SHA}"
          echo "URL: $URL"
          curl -fLsS --retry 3 --max-time 40 -D /tmp/an-headers "$URL" -o /tmp/an-index.html
          grep -iE '^(HTTP/|last-modified:|cache-control:|etag:|age:|x-github-request-id:)' /tmp/an-headers || true
          echo "LIVE HTML BYTES: $(wc -c </tmp/an-index.html)"
          echo "LIVE HTML SHA256: $(sha256sum /tmp/an-index.html)"
          echo "STUDENT_EXPERIENCES: $(grep -o 'Student Experiences' /tmp/an-index.html | wc -l)"
          echo "TWO_PANEL_ID: $(grep -o 'an-community-columns' /tmp/an-index.html | wc -l)"
          echo "FRESH_ROUTE: $(grep -o 'hub_refresh' /tmp/an-index.html | wc -l)"
          if grep -q 'Student Experiences' /tmp/an-index.html; then
            echo "::error::Published HTML is an older single-panel Success Stories source."
            exit 1
          fi
          curl -fLsS --retry 3 --max-time 35 "https://mehedialimayon-del.github.io/salesman-performance-app/an-overseas/secure-platform.js?verify=${GITHUB_SHA}" -o /tmp/secure-platform.js
          echo "LEGACY_OVERRIDE_COUNT: $(grep -o 'successPage=function' /tmp/secure-platform.js | wc -l)"
          if grep -q 'successPage=function' /tmp/secure-platform.js; then
            echo "::error::The old secure-platform override remains in the published JavaScript."
            exit 1
          fi
          if ! grep -q 'an-community-columns' /tmp/an-index.html; then
            echo "::error::Published HTML missing the two-panel Student Hub."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install mobile browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Visit public Student Hub on phone-sized browser
        shell: bash
        run: |
          mkdir -p qa-student-hub
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            let failed=false;const details=[];
            for(const size of [[360,800],[412,900]]){
              const page=await browser.newPage({viewport:{width:size[0],height:size[1]},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const uri='https://mehedialimayon-del.github.io/salesman-performance-app/an-overseas/index.html?liveqa='+encodeURIComponent(process.env.GITHUB_SHA)+'&hub_refresh=20261103-fresh-1#/success';
              await page.goto(uri,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(3500);
              const result=await page.evaluate(()=>{
                const g=id=>document.getElementById(id);
                const a=g('an-insights-gallery'),b=g('an-success-gallery');
                const box=g('an-community');
                const card=a?.querySelector('.an-community-card');
                const css=a?getComputedStyle(a):null;
                return {
                  title:document.title,
                  location:location.href,
                  hasHub:!!box,
                  insightsVisible:!!a,
                  successVisible:!!b,
                  oldPage:document.body.textContent.includes('Student Experiences'),
                  studyCardCount:a?.querySelectorAll('.an-community-card').length||0,
                  pageHeight:document.documentElement.scrollHeight,
                  viewportHeight:window.innerHeight,
                  galleryScroll:css?.overflowY||'missing',
                  panelCount:document.querySelectorAll('.an-community-panel').length,
                  hasHomeNavigation:!!document.querySelector('header.top .brand[href="#/home"]'),
                  successFunction:typeof successPage==='function'?successPage.toString().slice(0,320):'missing',
                  appHtml:document.querySelector('#app')?.innerHTML.slice(0,360),
                  scripts:[...document.scripts].map(x=>x.src||'inline')
                };
              });
              result.viewport=size.join('x');result.errors=errors;console.log('LIVE PHONE',JSON.stringify(result));details.push(result);
              await page.screenshot({path:'qa-student-hub/hub-'+size.join('x')+'.png',fullPage:true});
              if(result.oldPage||!result.hasHub||!result.insightsVisible||!result.successVisible||result.panelCount!==2||errors.length)failed=true;
              // Exercise the actual published post: compact card -> full-screen reader -> full-size photo -> back.
              try{
                await page.waitForSelector('#an-insights-gallery [data-an-read-detail="study"]',{timeout:14000});
                const inline=await page.locator('#an-insights-gallery .an-community-desc').first().evaluate(e=>({full:e.textContent.length,box:e.getBoundingClientRect().height,overflow:getComputedStyle(e).overflow}));
                await page.locator('#an-insights-gallery [data-an-read-detail="study"]').first().click();
                await page.waitForSelector('dialog.an-detail-dialog[open]',{timeout:6000});
                const reading=await page.evaluate(()=>{
                  const dlg=document.querySelector('dialog.an-detail-dialog'),photo=dlg?.querySelector('.an-reader-media img'),copy=dlg?.querySelector('.an-reader-description');
                  const media=dlg?.querySelector('.an-reader-media');
                  const scroll=dlg?.querySelector('.an-reader-scroll');
                  const r=dlg?.getBoundingClientRect();
                  return {open:dlg?.open||false,fullHeight:Math.round(r?.height||0),viewportHeight:innerHeight,
                   mediaBeforeDescription:!!(media&&copy&&(media.compareDocumentPosition(copy)&Node.DOCUMENT_POSITION_FOLLOWING)),
                   descriptionChars:copy?.textContent.length||0,hasImage:!!photo,
                   scrollMode:scroll?getComputedStyle(scroll).overflowY:'missing',
                   hasBack:!!dlg.querySelector('[data-an-close-detail]')};
                });
                await page.screenshot({path:'qa-student-hub/reader-'+size.join('x')+'.png'});
                if(!reading.open||reading.fullHeight<reading.viewportHeight-15||!reading.mediaBeforeDescription||reading.descriptionChars<inline.full||reading.scrollMode!=='auto'||!reading.hasBack)failed=true;
                let fullPhoto=false,photoBack=false,readerBack=false;
                if(reading.hasImage){
                  await page.locator('dialog.an-detail-dialog .an-reader-photo-button').click();
                  await page.waitForSelector('dialog.an-preview-dialog[open]',{timeout:6000});
                  fullPhoto=await page.locator('dialog.an-preview-dialog img').count()===1;
                  await page.locator('dialog.an-preview-dialog [data-an-close]').click();
                  await page.waitForFunction(()=>!document.querySelector('dialog.an-preview-dialog')?.open,null,{timeout:6000});
                  photoBack=await page.locator('dialog.an-detail-dialog[open]').count()===1;
                }
                await page.locator('dialog.an-detail-dialog [data-an-close-detail]').click();
                await page.waitForFunction(()=>!document.querySelector('dialog.an-detail-dialog')?.open,null,{timeout:6000});
                readerBack=await page.locator('#an-community').count()===1;
                if(reading.hasImage&&(!fullPhoto||!photoBack))failed=true;
                if(!readerBack)failed=true;
                console.log('LIVE READER',JSON.stringify({viewport:size.join('x'),inline,reading,fullPhoto,photoBack,readerBack}));
              }catch(e){console.error('LIVE READER FAILED',size.join('x'),e.stack||e.message);failed=true;}
              await page.close();
            }
            fs.writeFileSync('qa-student-hub/results.json',JSON.stringify(details,null,2));
            await browser.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Keep screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: an-student-hub-live-check
          path: qa-student-hub/
          if-no-files-found: ignore
          retention-days: 7
