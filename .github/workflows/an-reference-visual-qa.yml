name: A&N Approved About Reference QA
on:
  push:
    paths:
      - '.github/workflows/an-reference-visual-qa.yml'
      - 'an-overseas/index.html'
      - 'an-overseas/an-about-approved-pixel-overlay-20261108.css'
      - 'an-overseas/an-about-approved-pixel-overlay-20261108.js'
      - 'an-overseas/assets/an-about-approved-reference-hero-20261108.webp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-reference-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify reference artwork, waving flags and functional chapter links
        shell: bash
        run: |
          mkdir -p qa-approved-about
          python3 -m http.server 8765 --directory an-overseas >/tmp/an-reference-server.log 2>&1 &
          sleep 2
          timeout 170s node <<'JS'
          const { chromium }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const results=[];
            for(const [width,height] of [[1366,768],[1536,864],[390,844]]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'no-preference'});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/index.html#/aboutdetails',{waitUntil:'domcontentloaded'});
              await page.waitForSelector('#an2-story .an2-founder-hero',{timeout:12000});
              await page.waitForTimeout(1500);
              const data=await page.evaluate(()=>{
                const hero=document.querySelector('#an2-story .an2-founder-hero');
                const portrait=hero?.querySelector('.an2-founder-person img');
                const source=document.querySelector('.an2-approved-reference-source');
                const flag=document.querySelector('.an-reference-flag-cloth');
                return {
                  cssClass:document.body.classList.contains('an-reference-pixel-view'),
                  imageBackground:hero?getComputedStyle(hero).backgroundImage:'',
                  portraitLoaded:!!portrait?.complete&&portrait.naturalWidth>0,
                  flags:hero?.querySelectorAll('.an-reference-flag').length||0,
                  columns:getComputedStyle(hero?.querySelector('.an-reference-flags')||hero).gridTemplateColumns,
                  animation:flag?getComputedStyle(flag).animationName:null,
                  links:hero?.querySelectorAll(':scope > .an2-nav a[data-an-about-jump]').length||0,
                  mobileReferenceLoaded:!!source?.complete&&source.naturalWidth>0,
                  chapters:[1,2,3,4,5,6,7].every(n=>!!document.querySelector(n===1?'#an2-origins':n===2?'#an2-purpose':n===3?'#an2-platform':n===4?'#an2-family':n===5?'#an2-services':n===6?'#an2-trust':'#an2-future')),
                  horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  scrollHeight:document.documentElement.scrollHeight,
                  viewportHeight:innerHeight,
                  heroBottom:hero?.getBoundingClientRect().bottom||0
                };
              });
              const asset=await page.request.get('http://127.0.0.1:8765/assets/an-about-approved-reference-hero-20261108.webp');
              data.assetStatus=asset.status();data.assetSize=(await asset.body()).length;
              data.width=width;data.height=height;data.errors=errors;
              await page.evaluate(()=>window.scrollTo(0,0));
              await page.screenshot({path:`qa-approved-about/hero-${width}x${height}.png`,fullPage:false});
              if(width>=801){
                const l=page.locator('[data-an-about-jump="an2-services"]');
                await l.click({force:true});
                await page.waitForTimeout(450);
                data.clickRetainsRoute=new URL(page.url()).hash==='#/aboutdetails';
              }
              const valid=width>=801
               ?data.cssClass&&data.flags===40&&data.links===5&&data.portraitLoaded&&
                data.imageBackground.includes('an-about-approved-reference-hero-20261108.webp')&&
                data.assetStatus===200&&data.assetSize>120000&&data.chapters&&
                data.clickRetainsRoute&&data.horizontalOverflow<=3&&data.heroBottom<=height+6&&
                data.scrollHeight>height+200&&!errors.length
               :!data.cssClass&&data.flags===0&&data.mobileReferenceLoaded&&data.chapters&&!errors.length;
              results.push({...data,valid});
              console.log('APPROVED ABOUT QA',JSON.stringify({...data,valid}));
              if(!valid)process.exitCode=1;
              await page.close();
            }
            fs.writeFileSync('qa-approved-about/results.json',JSON.stringify(results,null,2));
            await browser.close();
          })().catch(err=>{console.error(err);process.exitCode=1});
          JS
      - name: Upload actual Chromium screenshots and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-about-reference-chromium
          path: qa-approved-about/
          retention-days: 7