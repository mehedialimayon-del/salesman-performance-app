name: FieldForce Task Assignment and Staff Delete QA
on:
  push:
    branches: [main]
    paths:
      - 'accounts.js'
      - 'task-assignee-access.js'
      - 'index.html'
      - '.github/workflows/ffh-task-account-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-permission-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check affected JS syntax
        run: |
          node --check accounts.js
          node --check task-assignee-access.js
      - name: Check entrypoint wiring and owner delete controls
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const accounts=fs.readFileSync('accounts.js','utf8');
          const picker=fs.readFileSync('task-assignee-access.js','utf8');
          for(const term of ['task-assignee-access.js','accounts.js?v=zone-team-search-password-20261103-1']){
            if(!html.includes(term))throw Error('Missing live index script '+term);
          }
          for(const term of ['ffDeleteStaff','ffOwnerDeleteStaffForm','ffDeletedStaffHistory','confirm_staff_id']){
            if(!accounts.includes(term))throw Error('Missing owner staff delete '+term);
          }
          if(!picker.includes("ffh_task_recipients"))throw Error('Task recipient RPC not connected');
          console.log('Task assignment and account delete UI entrypoints verified.');
          NODE
