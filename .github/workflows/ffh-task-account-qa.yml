name: FieldForce Task Assignment and Staff Delete QA
on:
  push:
    branches: [main]
    paths:
      - 'accounts.js'
      - 'task-assignee-access.js'
      - 'searchable-picker.js'
      - 'staff-directory.css'
      - 'tests/task-universal-recipient.cjs'
      - 'tests/zone-manager-picker.cjs'
      - 'index.html'
      - 'ffh-task-selected-view-20261107.js'
      - 'tests/task-selected-identity-20261107.cjs'
      - '.github/workflows/ffh-task-account-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-permission-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Check affected JS syntax
        run: |
          node --check accounts.js
          node --check task-assignee-access.js
          node --check ffh-task-selected-view-20261107.js
          node --check tests/task-selected-identity-20261107.cjs
          node --check searchable-picker.js
          node --check tests/zone-manager-picker.cjs
          node --check tests/task-universal-recipient.cjs
      - name: Test zone manager portraits and universal task recipient filters
        run: |
          node tests/zone-manager-picker.cjs
          node tests/task-universal-recipient.cjs
          node tests/task-selected-identity-20261107.cjs
      - name: Check entrypoint wiring and owner delete controls
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const accounts=fs.readFileSync('accounts.js','utf8');
          const picker=fs.readFileSync('task-assignee-access.js','utf8');
          for(const term of ['task-assignee-access.js','accounts.js?v=']){
            if(!html.includes(term))throw Error('Missing live index script '+term);
          }
          for(const term of ['ffDeleteStaff','ffOwnerDeleteStaffForm','ffDeletedStaffHistory','confirm_staff_id']){
            if(!accounts.includes(term))throw Error('Missing owner staff delete '+term);
          }
          if(!picker.includes("ffh_task_recipients"))throw Error('Task recipient RPC not connected');
          console.log('Task assignment and account delete UI entrypoints verified.');
          NODE
