name: A&N Itemized Scholarships and Founder Layout QA
on:
  push:
    paths:
      - "an-overseas/index.html"
      - "an-overseas/an-final-precision-20261106.css"
      - "an-overseas/an-scholarship-verified-points-20261106.js"
      - ".github/workflows/an-itemized-scholarship-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual rendered desktop and phone UI
        shell: bash
        run: |
          python3 -m http.server 8765 --directory an-overseas >/tmp/an-itemized-http.log 2>&1 &
          sleep 1
          timeout 200s node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            let fail=false;
            for(const [w,h] of [[375,812],[1366,768]]){
              const p=await b.newPage({viewport:{width:w,height:h}});
              const errors=[];p.on('pageerror',e=>errors.push(e.message));
              const go=async route=>{await p.goto('http://127.0.0.1:8765/index.html?qa=itemized#/'+route,{waitUntil:'domcontentloaded'});await p.waitForTimeout(1100);};
              await go('aboutdetails');
              const about=await p.evaluate(()=>{
                const f=document.querySelector('.an2-founder-person');
                const flag=document.querySelector('.an2-floating-flags .an2-flag');
                const quote=document.querySelector('.an2-quote-footer');
                return {portrait:Math.round(f?.getBoundingClientRect().height||0),
                  portraitX:Math.round(f?.getBoundingClientRect().x||0),
                  flagWidth:Math.round(flag?.getBoundingClientRect().width||0),
                  flagAnimation:flag&&getComputedStyle(flag).animationName,
                  boxHeight:Math.round(quote?.getBoundingClientRect().height||0)};
              });
              await go('scholarship/erasmus-mundus');
              const er=await p.evaluate(()=>({
                unified:!!document.querySelector('#an-scholarship-complete-guide'),
                fees:document.querySelector('.an-programme-costs')?.textContent.includes('€4,000/year'),
                verified:document.querySelectorAll('.an-specific-guide article').length>=4,
                noDuplicate:!document.querySelector('#an-scholarship-decision-board')&&!document.querySelector('#an-scholarship-document-guide')&&!document.querySelector('#an-scholarship-verified-walk')
              }));
              await go('scholarship/daad-epos-masters');
              const ep=await p.evaluate(()=>({
                unified:!!document.querySelector('#an-scholarship-complete-guide'),
                courses:document.querySelectorAll('.an-epos-course').length,
                feeCards:document.querySelectorAll('.an-epos-course .an-programme-fee-breakdown').length,
                namedFees:[...document.querySelectorAll('.an-epos-course .an-programme-fee-breakdown')].filter(el=>!el.textContent.includes('No independently verified exact fee')).length,
                details:document.querySelectorAll('.an-epos-course details.an-course-apply-steps').length,
                noGeneric:!document.querySelector('#an-scholarship-document-guide')&&!document.querySelector('#an-scholarship-decision-board')
              }));
              await go('scholarship/hungary-masters');
              const other=await p.evaluate(()=>({
                unified:!!document.querySelector('#an-scholarship-complete-guide'),
                fee:!!document.querySelector('.an-programme-costs'),
                basic:document.querySelectorAll('.an-scholarship-section-grid>.an-scholarship-section').length,
                documents:!!document.querySelector('#an-scholarship-document-guide'),
                noDuplicate:!document.querySelector('#an-scholarship-decision-board')&&!document.querySelector('#an-scholarship-verified-walk')
              }));
              const ok=about.portrait>=250&&about.flagWidth>=44&&about.flagWidth<=64&&about.flagAnimation.includes('anTinyFlagWave')&&er.unified&&er.fees&&er.verified&&er.noDuplicate&&ep.unified&&ep.courses===27&&ep.feeCards===27&&ep.details===27&&ep.noGeneric&&other.unified&&other.fee&&other.basic===6&&other.documents&&other.noDuplicate&&!errors.length;
              const result={viewport:w+'x'+h,about,erasmus:er,epos:ep,generic:other,errors,passed:ok};
              console.log('ITEMIZED QA '+JSON.stringify(result));
              if(!ok){fail=true;console.error('ITEMIZED QA FAILED '+w);}
              await p.close();
            }
            await b.close();
            if(fail)process.exitCode=1;
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          JS
