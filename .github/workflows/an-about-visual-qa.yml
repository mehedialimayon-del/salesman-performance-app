name: A&N About responsive visual QA
on:
  push:
    paths:
      - ".github/workflows/an-about-visual-qa.yml"
      - "an-overseas/an-premium-public.js"
      - "an-overseas/an-about-fixed.css"
      - "an-overseas/an-about-experience.css"
      - "an-overseas/index.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  about-layout-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check About, Vision, Management and full story at mobile and desktop widths
        shell: bash
        run: |
          mkdir -p qa-artifacts
          python3 -m http.server 8765 --directory an-overseas >/tmp/an-about-test-http.log 2>&1 &
          for attempt in $(seq 1 25); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 0.4
          done
          timeout 150s node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
            const metrics=[];
            const fixtures=[
              {key:'management',value:[
                {id:'nusrat-nasrin',name:'Nusrat Nasrin',position:'CEO & Head of Marketing',help:'Helping students plan their international education journey.',email:'nusratnasrin043@gmail.com',portfolio:'https://example.org/founder',photo:'https://mehedialimayon-del.github.io/salesman-performance-app/an-overseas/assets/hero-nusrat-20261030.webp'},
                {id:'member-two',name:'Second Team Member',position:'Student Adviser',help:'Student assistance and application guidance.',email:'team@example.org',phone:'+60123456789'}
              ]},
              {key:'settings',value:{about:'Founded in 2024, A&N Overseas supports students in choosing an appropriate university.',malaysiaOffice:'Kuala Lumpur, Malaysia',bangladeshOffice:'Rangpur, Bangladesh'}},
              {key:'latest_updates',value:[]},{key:'countries',value:[]},{key:'success_stories',value:[]},{key:'study_insights',value:[]}
            ];
            const sizes=[[360,760],[375,812],[412,900],[1366,768]];
            for(const [w,h] of sizes){
              const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
              await page.route(/https:\/\/svpgjrxeqnluipsgjywk\.supabase\.co\/rest\/v1\/an_site_content.*/,r=>r.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify(fixtures)}));
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/#/about',{waitUntil:'domcontentloaded',timeout:20000});
              await page.waitForFunction(()=>document.querySelector('.an-manager-name-box')?.textContent.includes('Nusrat'),null,{timeout:15000});
              const info=await page.evaluate(()=>{
                const $=s=>document.querySelector(s);
                const duo=$('.an-about-duo'),card=$('#an-manager-card'),i=$('.an-manager-information'),photo=$('.an-manager-photo');
                const cols=getComputedStyle(duo).gridTemplateColumns.split(/\s+/).filter(Boolean).length;
                return {
                  viewport:innerWidth+'x'+innerHeight,
                  horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  verticalScroll:document.documentElement.scrollHeight-document.documentElement.clientHeight,
                  columns:cols,
                  proofCards:document.querySelectorAll('.an-about-proof-card').length,
                  imageWidth:photo?Math.round(photo.getBoundingClientRect().width):0,
                  infoOverflow:i?Math.max(0,i.scrollHeight-i.clientHeight):999,
                  managerCardOverflow:card?Math.max(0,card.scrollHeight-card.clientHeight):999,
                  hasMailto:!!$('.an-manager-contact[href^="mailto:"]'),
                  hasWhatsAppLogo:!!$('.an-manager-contact .an-wa'),
                  nameFirst:!!$('.an-manager-name-box h3'),
                  designationSecond:!!$('.an-manager-position strong'),
                  supportThird:!!$('.an-manager-support p'),
                  arrows:document.querySelectorAll('[data-an-manager]').length
                };
              });
              info.errors=errors.slice();
              await page.locator('[data-an-manager="1"]').click();
              info.nextMember=await page.locator('.an-manager-name-box h3').innerText();
              info.nextWhatsAppLink=await page.locator('a.an-manager-contact[href^="https://wa.me/"]').count();
              await page.screenshot({path:'qa-artifacts/about-'+w+'x'+h+'.png',fullPage:true});
              await page.locator('.an-about-readmore[href="#/aboutdetails"]').click();
              await page.waitForURL('**/#/aboutdetails');
              info.detailsSteps=await page.locator('.an-story-step').count();
              info.detailsLogo=await page.locator('.an-story-hero .an-story-logo').count();
              await page.locator('[data-an-about-jump="visa"]').click();
              info.jumpRetainsRoute=(new URL(page.url())).hash==='#/aboutdetails';
              info.detailsHorizontalOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              await page.screenshot({path:'qa-artifacts/details-'+w+'x'+h+'.png',fullPage:true});
              metrics.push(info);
              console.log('ABOUT QA',JSON.stringify(info));
              await page.close();
            }
            fs.writeFileSync('qa-artifacts/qa-results.json',JSON.stringify(metrics,null,2));
            await browser.close();
            const failed=metrics.some(x=>
              x.horizontalOverflow>3||
              x.detailsHorizontalOverflow>3||
              x.columns!==(parseInt(x.viewport)>=801?2:1)||
              x.proofCards!==3||
              x.imageWidth<200||
              x.infoOverflow>5||
              x.managerCardOverflow>5||
              !x.hasMailto||!x.hasWhatsAppLogo||
              !x.nameFirst||!x.designationSecond||!x.supportThird||
              x.arrows!==2||x.nextMember!=='Second Team Member'||x.nextWhatsAppLink!==1||
              x.detailsSteps!==12||x.detailsLogo!==1||!x.jumpRetainsRoute
            );
            if(failed){console.error('Responsive About QA failed: see metrics and screenshots');process.exitCode=1}
          })().catch(err=>{console.error(err);process.exitCode=1});
          JS
      - name: Upload review screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-N-About-Responsive-Review
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
