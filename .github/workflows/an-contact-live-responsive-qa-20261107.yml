name: A&N Contact Layout and Enquiry Visual QA
on:
  push:
    paths:
      - an-overseas/index.html
      - an-overseas/assets/contact-desktop-20261110.webp
      - an-overseas/assets/contact-mobile-reference-20261109.svg
      - an-overseas/an-contact-fixed-20261107.css
      - an-overseas/an-contact-photo-cards-20261107.css
      - an-overseas/an-contact-photo-cards-20261107.js
      - .github/workflows/an-contact-live-responsive-qa-20261107.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local contact screenshots and form tests at three screen sizes
        shell: bash
        run: |
          python3 -m http.server 8765 --directory . > /tmp/an-contact-local.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const [name,width,height] of [['desktop',1366,768],['phone-standard',375,812],['phone-small',320,640]]){
                const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
                await page.goto('http://127.0.0.1:8765/an-overseas/index.html#/contact',{waitUntil:'domcontentloaded',timeout:30000});
                const contact=page.locator('.an26-contact');
                await contact.waitFor();
                await page.waitForFunction(()=>{
                  const art=document.querySelector('.an26-reference');
                  const ticker=document.querySelector('#an-global-ticker');
                  if(!art?.naturalWidth||!ticker)return false;
                  const frame=art.getBoundingClientRect();
                  return frame.top>=ticker.getBoundingClientRect().bottom-2&&Math.abs(frame.bottom-innerHeight)<=2;
                });
                const layout=await contact.evaluate(el=>{
                  const box=node=>node.getBoundingClientRect();
                  return {
                    top:box(el).top,bottom:box(el).bottom,
                    ticker:box(document.querySelector('#an-global-ticker')).bottom,
                    width:document.documentElement.scrollWidth,overflow:getComputedStyle(document.body).overflowY,
                    socials:el.querySelectorAll('[data-an-social]').length,
                    submit:box(el.querySelector('button[type=submit]')).bottom,
                    desktop:el.classList.contains('an26-contact-desktop')
                  };
                });
                assert(layout.width<=width+2 && layout.overflow==="hidden",name+': fixed viewport');
                assert(layout.top>=layout.ticker-2 && Math.abs(layout.bottom-height)<=2,name+': fills space below ticker');
                assert(layout.socials===6 && layout.submit<=height,name+': contacts and enquiry visible');
                assert.equal(layout.desktop,width>=768);
                await page.screenshot({path:'contact-'+name+'.png'});
                if(layout.desktop){
                  await page.getByRole('link',{name:'Explore Our Management'}).click();
                  await page.waitForURL('**/#/management');
                  await page.locator('#an-manager-card').waitFor();
                  await page.goBack();
                  await contact.waitFor();
                }
                if(name!=='phone-small'){
                  let submitted;
                  await page.route('**/rest/v1/an_enquiries',async route=>{
                    const headers={'access-control-allow-origin':'*'};
                    if(route.request().method()==='OPTIONS'){
                      await route.fulfill({status:204,headers:{...headers,
                        'access-control-allow-methods':'POST','access-control-allow-headers':'*'}});
                      return;
                    }
                    submitted=route.request().postDataJSON();
                    await route.fulfill({status:201,headers});
                  });
                  await page.locator('#contact-form [name=name]').fill('Visual QA');
                  await page.locator('#contact-form [name=email]').fill('qa@example.invalid');
                  await page.locator('#contact-form textarea').fill('Intercepted test');
                  await page.getByRole('button',{name:'Send Enquiry'}).click();
                  await page.locator('#an-contact-feedback').getByText(/submitted successfully/i).waitFor({timeout:10000});
                  assert.equal(submitted.full_name,'Visual QA');
                }
                await page.close();
              }
            }finally{await browser.close()}
            console.log('PASS contact viewport, management navigation and enquiry form');
          })().catch(err=>{console.error(err.stack||err);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: an-contact-responsive-qa
          path: contact-*.png
          if-no-files-found: ignore
          retention-days: 7
