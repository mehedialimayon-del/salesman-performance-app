name: FieldForce Hub 1.10 PDF auto-open verification build

on:
  push:
    branches:
      - fix/pdf-auto-open-1.10
    paths:
      - 'android/**'
      - '.github/workflows/fieldforce-android-pdf-open.yml'

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare app icon
        run: |
          python -m pip install --quiet Pillow
          python android/make_icons.py
      - name: Run native regression tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon
      - name: Build and align release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleRelease --no-daemon
          mkdir -p dist/signing-tools
          input=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$input"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$input" dist/FieldForce-Hub-1.10-unsigned.apk
          cp -R "$ANDROID_HOME/build-tools/35.0.0/." dist/signing-tools/
          printf 'Release: 1.10\nBuild: aligned unsigned APK; production signing is performed locally with the existing certificate.\nNative regression tests: passed before build.\nPhysical handset acceptance: not run in CI.\n' > dist/BUILD-INFO.txt
          sha256sum dist/FieldForce-Hub-1.10-unsigned.apk > dist/SHA256.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/FieldForce-Hub-1.10-unsigned.apk | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: FieldForce-Hub-1.10-Unsigned-Verification
          path: dist/*
          if-no-files-found: error
          retention-days: 30
