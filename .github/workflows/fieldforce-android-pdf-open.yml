name: FieldForce Hub 1.10 PDF auto-open release

on:
  push:
    branches:
      - fix/pdf-auto-open-1.10
    paths:
      - 'android/**'
      - '.github/workflows/fieldforce-android-pdf-open.yml'

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare app icon
        run: |
          python -m pip install --quiet Pillow
          python android/make_icons.py
      - name: Restore production signing key
        shell: bash
        env:
          FFH_KEYSTORE_B64: ${{ secrets.FFH_KEYSTORE_B64 }}
          FFH_KEYSTORE_PASS: ${{ secrets.FFH_KEYSTORE_PASS }}
          FFH_KEY_ALIAS: ${{ secrets.FFH_KEY_ALIAS }}
          FFH_KEY_PASS: ${{ secrets.FFH_KEY_PASS }}
        run: |
          set -euo pipefail
          test -n "$FFH_KEYSTORE_B64"
          test -n "$FFH_KEYSTORE_PASS"
          test -n "$FFH_KEY_ALIAS"
          test -n "$FFH_KEY_PASS"
          printf '%s' "$FFH_KEYSTORE_B64" | base64 --decode > android/app/signing.jks
          keytool -list -keystore android/app/signing.jks -storepass "$FFH_KEYSTORE_PASS" -alias "$FFH_KEY_ALIAS" >/dev/null
      - name: Run native regression tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon
      - name: Build and verify signed release APK
        shell: bash
        env:
          FFH_KEYSTORE_PASS: ${{ secrets.FFH_KEYSTORE_PASS }}
          FFH_KEY_ALIAS: ${{ secrets.FFH_KEY_ALIAS }}
          FFH_KEY_PASS: ${{ secrets.FFH_KEY_PASS }}
        run: |
          set -euo pipefail
          gradle -p android :app:assembleRelease --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/FieldForce-Hub-1.10.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/FieldForce-Hub-1.10.apk | tee dist/SIGNATURE-INFO.txt
          grep -F 'b8bf91d5cfb1a5cddaa4d9e887a5c67f3976515df63c4abff3dd092488c5dbb5' dist/SIGNATURE-INFO.txt
          sha256sum dist/FieldForce-Hub-1.10.apk > dist/SHA256.txt
          printf 'Release: 1.10\nPDF exports: saved PDFs open in the installed PDF viewer.\nAutomated Android unit tests: passed before APK build.\nPhysical handset acceptance: not run in CI.\n' > dist/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FieldForce-Hub-1.10-Signed-Release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
