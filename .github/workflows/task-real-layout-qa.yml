name: FieldForce Tasks Compact Filter QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/feedback-20261107-browser.cjs'
      - 'ffh-task-compact-live.css'
      - 'searchable-picker.js'
      - 'ffh-task-compact-live.js'
      - 'index.html'
      - '.github/workflows/task-real-layout-qa.yml'
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium test runtime
        run: npm --prefix /tmp/ffh-qa install --no-save playwright@1.58.2
      - name: Run scoped mobile layout and picker regression
        env:
          NODE_PATH: /tmp/ffh-qa/node_modules
          FFH_CHROMIUM: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 >/tmp/ffh-scope-http.log 2>&1 &
          node tests/feedback-20261107-browser.cjs
      - name: Check actual GitHub Pages published version
        shell: bash
        run: |
          set -euo pipefail
          url="https://mehedialimayon-del.github.io/salesman-performance-app"
          ok=0
          for i in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 15 "$url/?qa_commit=${GITHUB_SHA}" > /tmp/ffh-live-index.html &&
               grep -q 'ffh-task-compact-live.css' /tmp/ffh-live-index.html &&
               grep -q 'ffh-task-compact-live.js' /tmp/ffh-live-index.html &&
               grep -q '20261107-search-id-route-2' /tmp/ffh-live-index.html; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" -eq 1
          curl --fail --silent --show-error --max-time 15 "$url/ffh-task-compact-live.css?qa_commit=${GITHUB_SHA}" | grep -q 'ffTaskCompactV2'
          curl --fail --silent --show-error --max-time 15 "$url/ffh-task-compact-live.js?qa_commit=${GITHUB_SHA}" | grep -q 'SELECT SR / FILTER'
          echo "PASS LIVE GitHub Pages: served compact Tasks CSS/JS and refreshed SR search script for commit ${GITHUB_SHA}"
      - name: Preserve screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-mobile-filter-regression
          path: /tmp/ffh-followup-task-390.png
          if-no-files-found: ignore
