name: FieldForce Tasks Live Layout QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/task-real-layout-20261107.cjs'
      - 'ffh-task-compact-live.css'
      - 'ffh-task-compact-live.js'
      - 'index.html'
      - '.github/workflows/task-real-layout-qa.yml'
jobs:
  real-task-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium test runtime
        run: npm --prefix /tmp/ffh-qa install --no-save playwright@1.58.2
      - name: Inspect real Tasks page in Chromium
        env:
          NODE_PATH: /tmp/ffh-qa/node_modules
          FFH_CHROMIUM: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 >/tmp/ffh-scope-http.log 2>&1 &
          node tests/task-real-layout-20261107.cjs
      - name: Preserve screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-real-layout-screenshot
          path: /tmp/ffh-actual-task-layout-debug.png
          if-no-files-found: ignore
