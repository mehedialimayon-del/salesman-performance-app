name: A&N University Directory Live QA
on:
  push:
    paths:
      - '.github/workflows/an-directory-live-qa.yml'
      - 'an-overseas/an-directory-layout-polish-20261108.js'
      - 'an-overseas/university-guide.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check the deployed directory and portfolio
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const base = 'https://mehedialimayon-del.github.io/salesman-performance-app/an-overseas/index.html';
          const html = fs.readFileSync('an-overseas/index.html','utf8');
          const markers = ['an-directory-layout-polish-20261108.js','an-user-requests-20261106.css'].map(file =>
            html.split(file + '?v=')[1].split('"')[0]).map((v,i) =>
              ['an-directory-layout-polish-20261108.js','an-user-requests-20261106.css'][i] + '?v=' + v);
          (async () => {
            let url;
            for (let attempt = 0; attempt < 30; attempt++) {
              url = base + '?directory_qa=' + Date.now();
              const response = await fetch(url);
              const deployed = await response.text();
              if (response.ok && markers.every(marker => deployed.includes(marker))) break;
              if (attempt === 29) throw Error('Current directory revision is not deployed');
              await new Promise(resolve => setTimeout(resolve, 6000));
            }
            const browser = await chromium.launch();
            try {
              for (const width of [360, 412, 1366]) {
                const page = await browser.newPage({viewport:{width,height:850},isMobile:width<600,hasTouch:width<600});
                await page.goto(url + '#/universities', {waitUntil:'domcontentloaded'});
                const tools = page.locator('.an-directory-controls');
                const metrics = await page.waitForFunction(() => {
                  const icons = [...document.querySelectorAll('.an-directory-controls svg.an-directory-icon')];
                  if (icons.length !== 4 || document.querySelectorAll('#results article').length < 6) return false;
                  return icons.map(el => {
                    const r = el.getBoundingClientRect();
                    const button = el.parentElement.getBoundingClientRect();
                    return {x:r.x,right:r.right,y:r.y,width:r.width,buttonWidth:button.width};
                  });
                }).then(handle => handle.jsonValue());
                console.log('CONTROLS',width,JSON.stringify(metrics));
                await page.screenshot({path:'universities-'+width+'.png'});
                assert.equal(metrics.length,4);
                assert(metrics.every((r,i) => Math.abs(r.width-20)<1 && r.x>=0 && r.right<=width &&
                  Math.abs(r.y-metrics[0].y)<2 && Math.abs(r.buttonWidth-metrics[0].buttonWidth)<2 &&
                  (i===0 || r.x>metrics[i-1].right)));
                const cards = page.locator('#results article');
                const boxes = await cards.evaluateAll(nodes => nodes.slice(0,16).map(node => {
                  const r = node.getBoundingClientRect();
                  return {height:r.height, x:r.x};
                }));
                console.log('CARD METRICS',width,JSON.stringify(boxes));
                assert(boxes.length>5 && boxes.every(r => Math.abs(r.height-boxes[0].height)<2));
                if(width<600) assert(boxes.every(r => r.x===boxes[0].x));
                const overview = await cards.first().evaluate(card => {
                  const rects = [...card.querySelectorAll('.card-open,.an-guide-official,.an-catalogue-apply')].map(el => el.getBoundingClientRect());
                  return {facts:card.querySelectorAll('.an-card-fact').length,rank:card.querySelector('.an-card-fact')?.textContent,
                    overlay:!!card.querySelector('.an-guide-rank'),badge:card.querySelector('.an-card-identity .badge')?.textContent,
                    buttonSizes:rects.map(r=>[r.width,r.height])};
                });
                console.log('CARD OVERVIEW',width,JSON.stringify(overview));
                assert.equal(await page.locator('.an-directory-totals>span').count(),2);
                assert.equal(overview.facts,4);
                assert(overview.rank.includes('QS World Ranking') && overview.rank.includes('#56'));
                assert(!overview.overlay && overview.badge.includes('Public University'));
                assert(overview.buttonSizes.length===3 && overview.buttonSizes.every(([w,h])=>Math.abs(w-overview.buttonSizes[0][0])<=2 && h===33));
                const colors = await cards.first().locator('.card-open,.an-guide-official,.an-catalogue-apply').evaluateAll(nodes => nodes.map(n => getComputedStyle(n).backgroundColor));
                assert.deepEqual(colors,['rgb(240, 104, 0)','rgb(21, 43, 61)','rgb(6, 132, 85)']);
                const search = page.getByRole('searchbox',{name:'Search universities'});
                assert.equal(await search.isVisible(),false);
                await tools.getByRole('button',{name:'Open university search'}).click();
                await search.fill('Universiti Malaya');
                await page.waitForFunction(() => document.querySelectorAll('#results article').length===1);
                await search.fill('');
                await page.keyboard.press('Escape');
                await search.waitFor({state:'hidden'});
                await tools.getByRole('button',{name:'Choose scholarship type'}).click();
                await page.locator('#an-scholarship-category-panel').waitFor();
                await page.getByRole('button',{name:'All universities',exact:true}).click();
                await tools.locator('summary').click();
                await page.locator('#country-filter').waitFor();
                await tools.locator('summary').click();
                await tools.getByRole('link',{name:'Open Saved Universities'}).click();
                await page.waitForURL(target => target.hash==='#/favorites');
                await page.goto(url + '#/universities');
                await cards.first().getByRole('link',{name:'University Portfolio'}).click();
                await page.locator('.university-profile').waitFor();
                const headings = await page.locator('.university-profile h2,.university-profile h3').evaluateAll(nodes =>
                  [...new Set(nodes.map(n => getComputedStyle(n).color))]
                );
                assert(headings.includes('rgb(255, 255, 255)') && headings.includes('rgb(240, 104, 0)'));
                await page.screenshot({path:'portfolio-'+width+'.png'});
                console.log('PASS',width,JSON.stringify({metrics,cardHeight:boxes[0].height,colors,headings}));
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(e => {console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-university-screenshots
          path: |
            universities-*.png
            portfolio-*.png
          if-no-files-found: ignore
