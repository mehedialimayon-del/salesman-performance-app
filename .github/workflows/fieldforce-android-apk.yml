name: FieldForce Hub - Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Create an internal test APK, or a signed production APK"
        required: true
        default: test
        type: choice
        options:
          - test
          - production
  push:
    branches: [main, ffh-daily-20261020, ffh-duty-communication, ffh-notice-meetings-1-5, ffh-contacts-zone-20261018, ffh-unified-20261018]
    paths:
      - 'android/**'
      - 'tests/**'
      - 'contacts.js'
      - 'contacts.css'
      - 'accounts.js'
      - 'app.js'
      - 'earnings-core.js'
      - '.github/workflows/fieldforce-android-apk.yml'
      - 'an-logo.png'

permissions:
  contents: read

jobs:
  android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Generate launcher icons from existing app logo
        run: |
          python -m pip install --quiet Pillow
          python android/make_icons.py
      - name: Run native alarm regression tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon
      - name: Compile debug verification APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Build release for private local signing
        run: |
          gradle -p android :app:assembleRelease --no-daemon
          mkdir -p unsigned-release
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned-release/FieldForce-Hub-unsigned.apk
          cp -r android/app/build/test-results unsigned-release/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" unsigned-release/
      - name: Preserve verified unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: FieldForce-Hub-Unsigned-Release-${{ github.run_number }}
          path: unsigned-release/*
          retention-days: 30
      - name: Import persistent production signing key
        id: signing
        if: ${{ github.event_name == 'push' || inputs.build_type == 'production' }}
        shell: bash
        env:
          FFH_KEYSTORE_B64: ${{ secrets.FFH_KEYSTORE_B64 }}
          FFH_KEYSTORE_PASS: ${{ secrets.FFH_KEYSTORE_PASS }}
          FFH_KEY_ALIAS: ${{ secrets.FFH_KEY_ALIAS }}
          FFH_KEY_PASS: ${{ secrets.FFH_KEY_PASS }}
        run: |
          set -euo pipefail
          if [[ -z "$FFH_KEYSTORE_B64" || -z "$FFH_KEYSTORE_PASS" || -z "$FFH_KEY_ALIAS" || -z "$FFH_KEY_PASS" ]]; then
            if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
              echo 'Production signing secrets are missing. See android/README.md.' >&2
              exit 1
            fi
            echo 'Production signing is unavailable; retain the unsigned verified build.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$FFH_KEYSTORE_B64" | base64 --decode > android/app/signing.jks
          keytool -list -keystore android/app/signing.jks -storepass "$FFH_KEYSTORE_PASS" -alias "$FFH_KEY_ALIAS" > /dev/null
          cert_sha=$(keytool -exportcert -keystore android/app/signing.jks -storepass "$FFH_KEYSTORE_PASS" -alias "$FFH_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)
          if [[ "$cert_sha" != 'b8bf91d5cfb1a5cddaa4d9e887a5c67f3976515df63c4abff3dd092488c5dbb5' ]]; then
            echo 'Production certificate differs from the installed releases.' >&2
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Build APK and verification files
        shell: bash
        env:
          FFH_KEYSTORE_PASS: ${{ secrets.FFH_KEYSTORE_PASS }}
          FFH_KEY_ALIAS: ${{ secrets.FFH_KEY_ALIAS }}
          FFH_KEY_PASS: ${{ secrets.FFH_KEY_PASS }}
          IS_PRODUCTION: ${{ steps.signing.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$IS_PRODUCTION" == 'true' ]]; then
            gradle -p android :app:assembleRelease --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk dist/FieldForce-Hub.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/FieldForce-Hub.apk
            python android/scripts/make_assetlinks.py \
              --keystore android/app/signing.jks \
              --storepass "$FFH_KEYSTORE_PASS" \
              --alias "$FFH_KEY_ALIAS" \
              --out dist/assetlinks.json
            echo 'Type: signed production APK' > dist/BUILD-INFO.txt
            echo 'Native WebView with duty foreground service; physical-device acceptance required.' >> dist/BUILD-INFO.txt
          else
            gradle -p android :app:assembleDebug --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/FieldForce-Hub-TEST.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/FieldForce-Hub-TEST.apk
            echo 'Type: INTERNAL TEST ONLY. Do not distribute as production.' > dist/BUILD-INFO.txt
            echo 'Native WebView duty tracking build. Physical-device testing is still required.' >> dist/BUILD-INFO.txt
          fi
          sha256sum dist/*.apk >> dist/BUILD-INFO.txt
          ls -lh dist/
      - name: Upload APK for direct file distribution
        uses: actions/upload-artifact@v4
        with:
          name: FieldForce-Hub-Android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  web-regression:
    name: Web regression and mobile browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm --prefix /tmp/ffh-qa install --no-save jsdom@26.1.0 typescript@5.9.3 xlsx@0.18.5 playwright@1.58.2
      - name: Run regression scripts
        env:
          NODE_PATH: /tmp/ffh-qa/node_modules
        run: |
          set -euo pipefail
          for file in tests/*.cjs; do
            case "$file" in *duty-ui.cjs) continue ;; esac
            node "$file"
          done
      - name: Run actual Chromium mobile scenarios
        env:
          NODE_PATH: /tmp/ffh-qa/node_modules
          FFH_CHROMIUM: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 >/tmp/ffh-server.log 2>&1 &
          node tests/duty-ui.cjs

      - name: Preserve controlled report layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FieldForce-Report-UI-${{ github.run_number }}
          path: |
            /tmp/ffh-home-20-qa.png
            /tmp/ffh-daily-summary-qa.png
            /tmp/ffh-personal-income-qa.png
            /tmp/ffh-report-buttons-qa.png
            /tmp/ffh-reports-qa.png
            /tmp/ffh-summary-qa.png
          if-no-files-found: ignore
          retention-days: 7
