name: Build HomeForce Android
on:
  push:
    branches: [homeforce-household]
    paths: ['android/**', '.github/workflows/homeforce-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK signature and package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK"
          mkdir -p output
          cp "$APK" output/HomeForce-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeForce-Android-1.0
          path: output/HomeForce-1.0.apk
          retention-days: 30
