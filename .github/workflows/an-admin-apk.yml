name: A&N Overseas - Admin Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "an-overseas/admin-native/**"
      - "an-overseas/admin-app/**"
      - ".github/workflows/an-admin-apk.yml"

permissions:
  contents: write

concurrency:
  group: an-admin-build
  cancel-in-progress: true

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    name: Build separate installable A&N Admin APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile separate Android admin app
        run: gradle -p an-overseas/admin-native :app:assembleDebug --no-daemon
      - name: Verify signed installable APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp an-overseas/admin-native/app/build/outputs/apk/debug/app-debug.apk dist/AN-Overseas-Admin-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/AN-Overseas-Admin-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AN-Overseas-Admin-TEST.apk | head -8
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          printf '%s\n' 'A&N Overseas Admin - Android installable TEST APK' 'Separate package: com.anoverseas.admin' 'Background push when app is closed is not yet configured.' 'Requires internet, a valid admin login and authorized Supabase permissions.' > dist/README.txt
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AN-Overseas-Admin-Android-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish public direct-download copy
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p an-overseas/admin-app/download
          cp dist/AN-Overseas-Admin-TEST.apk an-overseas/admin-app/download/AN-Overseas-Admin-TEST.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add an-overseas/admin-app/download/AN-Overseas-Admin-TEST.apk
          if git diff --cached --quiet; then
            echo "APK identical to published copy"
          else
            git commit -m "Publish latest A&N Overseas Admin test APK [skip ci]"
            git push origin HEAD:main
          fi
