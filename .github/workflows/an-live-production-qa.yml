name: A&N Production Website Mobile/Desktop QA
on:
  push:
    paths: [".github/workflows/an-live-production-qa.yml"]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site-browser:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test the REAL GitHub Pages domain in Chromium
        shell: bash
        run: |
          timeout 240s node <<'JS'
          const {chromium}=require('playwright');
          const base='https://mehedialimayon-del.github.io/salesman-performance-app/an-overseas/index.html';
          const checks=[],issues=[];
          const note=(name,ok,details={})=>{
           checks.push({name,ok,...details});
           console.log((ok?'PASS':'FAIL')+' LIVE '+name+' '+JSON.stringify(details));
           if(!ok)issues.push(name);
          };
          (async()=>{
           // Verify the deployed HTML includes this release, not a stale Pages build.
           let ready=false;
           for(let i=0;i<8;i++){
            try{
             const response=await fetch(base+'?check='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
             const html=await response.text();
             if(response.ok&&html.includes('an-scholarship-verified-points-20261106.js?v=20261106-itemized-v2')&&html.includes('an-final-precision-20261106.css?v=20261106-color-fact-cards-v2')){ready=true;break;}
            }catch(e){console.log('Release polling:',e.message);}
            await new Promise(r=>setTimeout(r,5000));
           }
           note('current-release-publicly-served',ready);
           if(!ready)throw Error('GitHub Pages not yet serving latest HTML');
           const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
           for(const [name,width,height] of [['mobile',375,812],['desktop',1366,768]]){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const visit=async route=>{
              const url=base+'?qa='+Date.now()+'#/'+route;
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(850);
            };
            await visit('aboutdetails');
            const about=await page.evaluate(()=>{
             const el=document.querySelector('.an2-floating-flags .an2-flag');
             const f=document.querySelector('.an2-founder-person');
             const h=document.querySelector('.top .an-favorite-header svg');
             return {story:!!document.querySelector('.an2-story-chapter'),flag:Math.round(el?.getBoundingClientRect().width||0),portrait:Math.round(f?.getBoundingClientRect().height||0),
               red:h&&getComputedStyle(h).fill,animation:h&&getComputedStyle(h).animationName,flagMotion:el&&getComputedStyle(el).animationName};
            });
            note(name+'-story-portrait-small-flags-static-heart',about.story&&about.portrait>=220&&about.flag<=32&&about.flag>0&&about.red==='rgb(244, 38, 74)'&&about.animation==='none'&&about.flagMotion.includes('anTinyFlagWave'),about);
            if(name==='mobile')await page.screenshot({path:'mobile-about-live.png',fullPage:false});
            await visit('universities?country=Malaysia');
            const uc=await page.evaluate(()=>{
              const card=document.querySelector('#results .uni-card'),rects=['.catalogue-search','.catalogue-filter','#an-scholarship-category-toggle','.an-catalogue-favourites'].map(x=>document.querySelector(x)?.getBoundingClientRect().top??-1);
              return {cards:document.querySelectorAll('#results .uni-card').length,cardHeight:Math.round(card?.getBoundingClientRect().height||0),controls:rects,
                resultCount:document.querySelector('#catalogue-count')?.textContent?.slice(0,85)};
            });
            note(name+'-university-cards-four-control-toolbar',uc.cards>0&&uc.cardHeight>250&&uc.controls.every(x=>x>0&&Math.abs(x-uc.controls[0])<9),uc);
            await page.locator('#an-scholarship-category-toggle').click({timeout:9000});
            const menu=await page.locator('#an-scholarship-category-panel').isVisible();
            await page.locator('[data-scholarship-category="international"]').click({timeout:9000});
            const active=await page.locator('#an-scholarship-category-toggle').evaluate(el=>el.classList.contains('an-category-active'));
            note(name+'-interactive-scholarship-type-filter',menu&&active,{menu,active});
            if(name==='mobile')await page.screenshot({path:'mobile-universities-live.png',fullPage:false});
            await visit('scholarships');
            const sl=await page.evaluate(()=>{
              const area=document.querySelector('.an-scholarship-content-scroll');
              const f=document.querySelector('.an-scholarship-filters');
              return {featured:document.querySelectorAll('.an-feature-scholarship').length,nested:!!area?.querySelector('.an-feature-grid'),fixedFilters:!!f&&!area?.contains(f),scrollHeight:area?.scrollHeight||0,clientHeight:area?.clientHeight||0};
            });
            note(name+'-fixed-filter-scroll-from-featured-cards',sl.featured===4&&sl.nested&&sl.fixedFilters&&sl.scrollHeight>sl.clientHeight+100,sl);
            if(name==='mobile')await page.screenshot({path:'mobile-scholarships-live.png',fullPage:false});
            await visit('scholarship/erasmus-mundus');
            const em=await page.evaluate(()=>({moi:!!document.querySelector('.an-moi-badge:not(.no):not(.unknown)'),support:!!document.querySelector('#an-scholarship-help form'),cv:document.body.textContent.includes('Europass CV maximum TWO pages'),video:document.body.textContent.includes('200 MB'),deadline:document.querySelectorAll('.an-deadline-live').length}));
            note(name+'-erasmus-MOI-CV-video-timer-and-help',em.moi&&em.support&&em.cv&&em.video&&em.deadline>=2,em);
            const erPoints=await page.evaluate(()=>({facts:document.querySelectorAll('.an-decision-fact').length,steps:document.querySelectorAll('.an-application-walkthrough ol>li').length,form:!!document.querySelector('#an-scholarship-verified-walk'),ielts:document.querySelector('#an-scholarship-decision-board')?.textContent.includes('6.5 minimum')}));
            note(name+'-erasmus-itemized-MOI-language-application-steps',erPoints.facts===8&&erPoints.steps>=8&&erPoints.form&&erPoints.ielts,erPoints);
            await visit('scholarship/daad-epos-masters');
            const ep=await page.evaluate(()=>({courses:document.querySelectorAll('.an-epos-course').length,moiNo:!!document.querySelector('.an-moi-badge.no'),support:!!document.querySelector('#an-scholarship-help form')}));
            note(name+'-27-DAAD-programmes-with-MOI-warning',ep.courses>=27&&ep.moiNo&&ep.support,ep);
            const epPoints=await page.evaluate(()=>({facts:document.querySelectorAll('.an-decision-fact').length,steps:document.querySelectorAll('.an-epos-course details.an-course-apply-steps').length,visa:document.querySelector('#an-scholarship-decision-board')?.textContent.includes('€75')}));
            note(name+'-27-EPOS-course-specific-application-guides',epPoints.facts===8&&epPoints.steps>=27&&epPoints.visa,epPoints);
            await visit('contact');
            const contact=await page.evaluate(()=>({form:!!document.querySelector('#contact-form'),offices:document.querySelectorAll('.an-contact-office').length}));
            note(name+'-contact-form-offices',contact.form&&contact.offices===2,contact);
            note(name+'-no-uncaught-JavaScript-errors',errors.length===0,{errors:errors.slice(0,4)});
            await page.close();
           }
           await browser.close();
           console.log('LIVE REPORT '+JSON.stringify({passed:checks.filter(x=>x.ok).length,total:checks.length,issues}));
           if(issues.length)process.exitCode=1;
          })().catch(e=>{console.error('LIVE QA ERROR',e.stack||e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: an-production-mobile-screenshots
          path: mobile-*-live.png
          if-no-files-found: ignore
          retention-days: 7
