  <!-- =====================================================
       DRAGGABLE AYON AI BUTTON
       ===================================================== -->

  <script>

    (() => {

      const POSITION_KEY =
        'ayon.ai.button.position.v1';


      let suppressClick =
        false;



      function setupDraggableAI() {

        const fab =
          document.getElementById(
            'ayonAiFab'
          );


        if (
          !fab ||
          fab.dataset.dragReady ===
            '1'
        ) {
          return;
        }


        fab.dataset.dragReady =
          '1';


        fab.style.touchAction =
          'none';


        fab.style.userSelect =
          'none';


        fab.style.webkitUserSelect =
          'none';



        function limits() {

          const rect =
            fab.getBoundingClientRect();


          return {

            maxX:
              Math.max(
                0,
                window.innerWidth -
                rect.width
              ),

            maxY:
              Math.max(
                0,
                window.innerHeight -
                rect.height
              )

          };

        }



        function place(
          x,
          y
        ) {

          const lim =
            limits();


          const nx =
            Math.max(
              0,
              Math.min(
                lim.maxX,
                x
              )
            );


          const ny =
            Math.max(
              0,
              Math.min(
                lim.maxY,
                y
              )
            );


          fab.style.left =
            nx + 'px';


          fab.style.top =
            ny + 'px';


          fab.style.right =
            'auto';


          fab.style.bottom =
            'auto';


          return {
            x: nx,
            y: ny,
            lim
          };

        }



        function savePosition() {

          const rect =
            fab.getBoundingClientRect();


          const lim =
            limits();


          const xr =
            lim.maxX
              ? rect.left /
                lim.maxX
              : 0;


          const yr =
            lim.maxY
              ? rect.top /
                lim.maxY
              : 0;


          try {

            localStorage.setItem(

              POSITION_KEY,

              JSON.stringify({

                x:
                  Math.max(
                    0,
                    Math.min(
                      1,
                      xr
                    )
                  ),

                y:
                  Math.max(
                    0,
                    Math.min(
                      1,
                      yr
                    )
                  )

              })

            );

          } catch {}

        }



        function restorePosition() {

          try {

            const saved =
              JSON.parse(
                localStorage.getItem(
                  POSITION_KEY
                ) ||
                'null'
              );


            if (
              saved &&
              Number.isFinite(
                Number(
                  saved.x
                )
              ) &&
              Number.isFinite(
                Number(
                  saved.y
                )
              )
            ) {

              const lim =
                limits();


              place(

                Number(saved.x) *
                  lim.maxX,

                Number(saved.y) *
                  lim.maxY

              );

            }

          } catch {}

        }



        let drag =
          null;



        fab.addEventListener(

          'pointerdown',

          e => {

            if (
              e.button !==
                undefined &&
              e.button !== 0
            ) {
              return;
            }


            const rect =
              fab.getBoundingClientRect();


            drag = {

              pointerId:
                e.pointerId,

              startX:
                e.clientX,

              startY:
                e.clientY,

              left:
                rect.left,

              top:
                rect.top,

              moved:
                false

            };


            try {

              fab.setPointerCapture(
                e.pointerId
              );

            } catch {}

          }

        );



        fab.addEventListener(

          'pointermove',

          e => {

            if (
              !drag ||
              drag.pointerId !==
                e.pointerId
            ) {
              return;
            }


            const dx =
              e.clientX -
              drag.startX;


            const dy =
              e.clientY -
              drag.startY;


            if (
              Math.hypot(
                dx,
                dy
              ) > 5
            ) {

              drag.moved =
                true;

            }


            if (
              drag.moved
            ) {

              e.preventDefault();


              place(

                drag.left +
                  dx,

                drag.top +
                  dy

              );

            }

          }

        );



        function endDrag(e) {

          if (
            !drag
          ) {
            return;
          }


          if (
            e &&
            drag.pointerId !==
              e.pointerId
          ) {
            return;
          }


          if (
            drag.moved
          ) {

            suppressClick =
              true;


            savePosition();


            setTimeout(
              () => {

                suppressClick =
                  false;

              },
              250
            );

          }


          try {

            fab.releasePointerCapture(
              drag.pointerId
            );

          } catch {}


          drag =
            null;

        }



        fab.addEventListener(
          'pointerup',
          endDrag
        );


        fab.addEventListener(
          'pointercancel',
          endDrag
        );



        /*
          Drag করার পর AI যেন open না হয়।
          Normal tap করলে আগের মতো AI open হবে।
        */
        fab.addEventListener(

          'click',

          e => {

            if (
              suppressClick
            ) {

              e.preventDefault();

              e.stopImmediatePropagation();

            }

          },

          true

        );



        window.addEventListener(

          'resize',

          () => {

            const rect =
              fab.getBoundingClientRect();


            place(
              rect.left,
              rect.top
            );


            savePosition();

          }

        );



        restorePosition();

      }



      window.addEventListener(

        'DOMContentLoaded',

        () => {

          setTimeout(
            setupDraggableAI,
            100
          );


          /*
            Safety:
            AYON AI যদি পরে inject হয়।
          */
          const observer =
            new MutationObserver(
              () => {

                if (
                  document.getElementById(
                    'ayonAiFab'
                  )
                ) {

                  setupDraggableAI();

                }

              }
            );


          observer.observe(

            document.body,

            {
              childList: true,
              subtree: true
            }

          );

        },

        {
          once: true
        }

      );

    })();

  </script>



  <!-- =====================================================
       SERVICE WORKER
       ===================================================== -->

  <script>

    (() => {

      const VERSION =
        '20260918-final-8';



      function hideBoot() {

        const splash =
          document.getElementById(
            'bootSplash'
          );


        if (!splash) {
          return;
        }


        splash.classList.add(
          'hide'
        );


        setTimeout(
          () => {

            splash.remove();

          },
          250
        );

      }



      window.addEventListener(

        'DOMContentLoaded',

        () => {

          setTimeout(
            hideBoot,
            250
          );

        },

        {
          once: true
        }

      );



      /*
        Boot screen can never block the app.
      */
      setTimeout(
        hideBoot,
        1400
      );



      if (
        !(
          'serviceWorker'
          in navigator
        )
      ) {
        return;
      }



      window.addEventListener(

        'load',

        async () => {

          try {

            const reg =
              await navigator
                .serviceWorker
                .register(

                  './sw.js',

                  {
                    scope:
                      './',

                    updateViaCache:
                      'none'
                  }

                );


            await reg
              .update()
              .catch(
                () => {}
              );


            if (
              reg.waiting
            ) {

              reg.waiting
                .postMessage({

                  type:
                    'SKIP_WAITING',

                  version:
                    VERSION

                });

            }

          } catch (
            error
          ) {

            console.warn(
              'Service Worker:',
              error
            );

          }

        },

        {
          once: true
        }

      );

    })();

  </script>
