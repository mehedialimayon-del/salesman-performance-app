<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Sales Performance Hub</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="loginView" class="screen login-screen">
    <div class="login-card">
      <div class="logo-mark">SP</div>
      <p class="eyebrow">MODERN TRADE • SALES APP</p>
      <h1>Sales Performance Hub</h1>
      <p class="muted">Daily update • Monthly planning • Incentive • Shortfall • Tasks</p>
      <form id="loginForm" class="stack">
        <label>Username<input id="loginUser" autocomplete="username" required placeholder="e.g. sayem" /></label>
        <label>PIN<input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" required placeholder="4-digit PIN" /></label>
        <button class="btn primary" type="submit">Enter App</button>
      </form>
      <details class="demo-box"><summary>Demo login</summary><div>Manager: <b>manager / 2468</b><br>SR: <b>Ayon / 1111</b>, <b>bappi / 2222</b>, <b>wasif / 3333</b>, <b>jamil / 4444</b></div></details>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <header class="topbar">
      <div><p class="eyebrow" id="roleLabel">SALES REPRESENTATIVE</p><h2 id="welcomeName">Welcome</h2></div>
      <div class="top-actions"><button id="notifBtn" class="icon-btn" title="Tasks">🔔<span id="notifBadge" class="badge hidden">0</span></button><button id="logoutBtn" class="icon-btn" title="Logout">↪</button></div>
    </header>

    <main id="mainContent" class="content"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button data-page="dashboard" class="active"><span>⌂</span><small>Home</small></button>
      <button data-page="daily"><span>＋</span><small>Update</small></button>
      <button data-page="planning"><span>◎</span><small>Plan</small></button>
      <button data-page="incentive"><span>🏆</span><small>Incentive</small></button>
      <button data-page="summary"><span>▦</span><small>Summary</small></button>
    </nav>
  </section>

  <script src="app.js"></script>
</body>
</html>
