<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#080b0f">
  <meta name="color-scheme" content="dark">

  <meta
    name="description"
    content="Sales Performance Hub by KAM AYON"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Sales Hub"
  >

  <title>Sales Performance Hub</title>

  <link
    rel="manifest"
    href="./manifest.json?v=20260918-final-6"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icons/icon-192.png"
  >

  <link

    href="./icons/icon-192.png"

  <!-- Critical first-paint protection -->
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #080b0f;
      color: #f7f8fa;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    #bootSplash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255, 116, 20, 0.14),
          transparent 34%
        ),
        #080b0f;
      transition:
        opacity 0.22s ease,
        visibility 0.22s ease;
    }

    #bootSplash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-card {
      text-align: center;
      padding: 24px;
    }

    .boot-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 15px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: linear-gradient(
        135deg,
        #ff7414,
        #ff9d55
      );
      color: #090b0d;
      font-size: 27px;
      font-weight: 1000;
      box-shadow:
        0 18px 55px rgba(0, 0, 0, 0.42),
        0 0 0 7px rgba(255, 116, 20, 0.08);
    }

    .boot-title {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.25px;
    }

    .boot-sub {
      margin-top: 7px;
      color: #8d99a7;
      font-size: 12px;
    }

    .boot-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
    }

    .boot-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff7414;
      animation: bootDot 1s infinite ease-in-out;
    }

    .boot-dots span:nth-child(2) {
      animation-delay: 0.14s;
    }

    .boot-dots span:nth-child(3) {
      animation-delay: 0.28s;
    }

    @keyframes bootDot {
      0%,
      80%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }
  </style>

  <link
    rel="stylesheet"
    href="./styles.css?v=20260918-final-6"
  >
</head>

<body>

  <!-- =====================================================
       FAST START SCREEN
       ===================================================== -->
  <div id="bootSplash">
    <div class="boot-card">

      <div class="boot-logo">
        SP
      </div>

      <div class="boot-title">
        Sales Performance Hub
      </div>

      <div class="boot-sub">
        Loading your live sales workspace
      </div>

      <div class="boot-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>
  </div>


  <!-- =====================================================
       LOGIN
       ===================================================== -->
  <main
    id="loginView"
    class="login-screen hidden"
  >

    <section class="login-card">

      <div class="brand-block">

        <div class="brand-mark">
          SP
        </div>

        <div>
          <p class="eyebrow">
            KAM AYON
          </p>

          <h1>
            Sales Performance Hub
          </h1>

          <p class="muted">
            Live Sales • SKU • Outlet • Incentive • Task • AI
          </p>
        </div>

      </div>


      <form
        id="loginForm"
        class="stack"
        autocomplete="on"
      >

        <label>
          Staff ID

          <input
            id="loginUser"
            name="username"
            type="text"
            inputmode="text"
            autocomplete="username"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="e.g. M22075"
            required
          >
        </label>


        <label>
          Password

          <input
            id="loginPin"
            name="password"
            type="password"
            inputmode="text"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          >
        </label>


        <button
          type="submit"
          class="btn primary big-action"
        >
          SIGN IN
        </button>

      </form>


      <div class="login-note">

        <span class="sync-dot ok"></span>

        Google Sheets Live Database

      </div>


      <p class="developer-line">
        Developed by
        <strong>KAM AYON</strong>
      </p>

    </section>

  </main>


  <!-- =====================================================
       MAIN APP
       ===================================================== -->
  <div
    id="appView"
    class="app-shell hidden"
  >

    <!-- TOP BAR -->
    <header class="topbar">

      <div class="topbar-left">

        <div class="app-logo">
          SP
        </div>

        <div class="topbar-copy">

          <small id="roleLabel">
            SALES PERFORMANCE
          </small>

          <strong id="welcomeName">
            Sales Performance Hub
          </strong>

        </div>

      </div>


      <div class="topbar-actions">

        <button
          id="notifBtn"
          type="button"
          class="icon-button notification-button"
          aria-label="Notifications"
          title="Notifications"
        >

          <span aria-hidden="true">
            🔔
          </span>

          <span
            id="notifBadge"
            class="notification-badge hidden"
          >
            0
          </span>

        </button>


        <button
          id="logoutBtn"
          type="button"
          class="icon-button"
          aria-label="Settings"
          title="Settings"
        >
          ⚙
        </button>

      </div>

    </header>


    <!-- LIVE PAGE CONTENT -->
    <main
      id="mainContent"
      class="main-content"
      aria-live="polite"
    >
    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav
      id="bottomNav"
      class="bottom-nav"
      aria-label="Main navigation"
    >

      <button
        type="button"
        data-page="dashboard"
        class="active"
      >
        <span class="nav-icon">
          ⌂
        </span>

        <small>
          Home
        </small>
      </button>


      <button
        type="button"
        data-page="daily"
      >
        <span class="nav-icon">
          ＋
        </span>

        <small>
          Sales
        </small>
      </button>


      <button
        type="button"
        data-page="planning"
      >
        <span class="nav-icon">
          ◎
        </span>

        <small>
          Plan
        </small>
      </button>


      <button
        type="button"
        data-page="income"
      >
        <span class="nav-icon">
          RM
        </span>

        <small>
          Income
        </small>
      </button>


      <button
        type="button"
        data-page="summary"
      >
        <span class="nav-icon">
          ▦
        </span>

        <small>
          Summary
        </small>
      </button>

    </nav>

  </div>


  <!-- =====================================================
       GLOBAL TOAST
       ===================================================== -->
  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  >
  </div>


  <!-- =====================================================
       APP CONFIG + DATA + CORE APP
       ORDER IS IMPORTANT
       ===================================================== -->

  <script
    src="./config.js?v=20260918-final-6"
    defer
  ></script>

  <script
    src="./data.js?v=20260918-final-6"
    defer
  ></script>

  <script
    src="./app.js?v=20260918-final-6"
    defer
  ></script>

  <!-- AYON AI loads after the main Sales App -->
  <script
    src="./ayon-ai.js?v=20260918-final-6"
    defer
  ></script>


  <!-- =====================================================
       ONESIGNAL
       Does not contain any private API key
       ===================================================== -->
  <script>
    window.OneSignalDeferred =
      window.OneSignalDeferred || [];
  </script>

  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer
  ></script>


  <!-- =====================================================
       SERVICE WORKER / PWA
       ===================================================== -->
  <script>
    (() => {

      const VERSION =
        '20260918-final-6';


      function hideBoot() {

        const splash =
          document.getElementById(
            'bootSplash'
          );


        if (!splash) {
          return;
        }


        splash.classList.add(
          'hide'
        );


        setTimeout(
          () => splash.remove(),
          300
        );

      }


      /*
        Do not keep the user waiting for
        network/service-worker initialization.
      */
      window.addEventListener(
        'DOMContentLoaded',
        () => {

          setTimeout(
            hideBoot,
            300
          );

        },
        {
          once: true
        }
      );


      /*
        Absolute fallback.
        Splash can never block the app forever.
      */
      setTimeout(
        hideBoot,
        1600
      );


      if (
        !(
          'serviceWorker'
          in navigator
        )
      ) {
        return;
      }


      window.addEventListener(
        'load',
        async () => {

          try {

            const reg =
              await navigator
                .serviceWorker
                .register(
                  './sw.js',
                  {
                    scope:
                      './',

                    updateViaCache:
                      'none'
                  }
                );


            /*
              Check newest worker immediately.
            */
            await reg
              .update()
              .catch(
                () => {}
              );


            /*
              If a new worker is already waiting,
              ask it to activate.
            */
            if (
              reg.waiting
            ) {

              reg.waiting
                .postMessage({
                  type:
                    'SKIP_WAITING',

                  version:
                    VERSION
                });

            }


            reg.addEventListener(
              'updatefound',
              () => {

                const worker =
                  reg.installing;


                if (!worker) {
                  return;
                }


                worker.addEventListener(
                  'statechange',
                  () => {

                    if (
                      worker.state ===
                        'installed' &&
                      navigator
                        .serviceWorker
                        .controller
                    ) {

                      worker
                        .postMessage({
                          type:
                            'SKIP_WAITING',

                          version:
                            VERSION
                        });

                    }

                  }
                );

              }
            );

          } catch (error) {

            console.warn(
              'Service Worker:',
              error
            );

          }

        },
        {
          once: true
        }
      );

    })();
  </script>

</body>
</html>
